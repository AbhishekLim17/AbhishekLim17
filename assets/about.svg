<svg xmlns="http://www.w3.org/2000/svg" width="830" height="394" viewBox="0 0 830 394" role="img" aria-labelledby="t d"><title id="t">About Abhishek</title><desc id="d">WHO I AM: Hey, I'm Abhishek — an AI/ML student and full-stack web developer from Ahmedabad, India. I turn ideas into working products: LLM-powered applications, multi-model routing, AI agents and intelligent automation, built to operate at scale. WHAT I DO: My engineering work focuses on the layer most teams skip: reliable LLM routing with provider fallback chains, AI agent orchestration, structured tool calling, retrieval-augmented generation, and the backend infrastructure needed to keep these systems stable under real-world conditions. HOW I WORK: I operate at the intersection of AI engineering and scalable software architecture — where language models, APIs and business logic converge into production-grade software. Not research prototypes. Not demos. Systems that ship and stay running.</desc><rect x=".5" y=".5" width="829" height="393" fill="#1a1d20" stroke="#30353a"/><path shape-rendering="crispEdges" fill="#f4f1e6" d="M28 28h3v3h-3zM40 28h3v3h-3zM28 31h3v3h-3zM40 31h3v3h-3zM28 34h3v3h-3zM40 34h3v3h-3zM28 37h3v3h-3zM34 37h3v3h-3zM40 37h3v3h-3zM28 40h3v3h-3zM34 40h3v3h-3zM40 40h3v3h-3zM28 43h6v3h-6zM37 43h6v3h-6zM28 46h3v3h-3zM40 46h3v3h-3zM46 28h3v3h-3zM58 28h3v3h-3zM46 31h3v3h-3zM58 31h3v3h-3zM46 34h3v3h-3zM58 34h3v3h-3zM46 37h15v3h-15zM46 40h3v3h-3zM58 40h3v3h-3zM46 43h3v3h-3zM58 43h3v3h-3zM46 46h3v3h-3zM58 46h3v3h-3zM67 28h9v3h-9zM64 31h3v3h-3zM76 31h3v3h-3zM64 34h3v3h-3zM76 34h3v3h-3zM64 37h3v3h-3zM76 37h3v3h-3zM64 40h3v3h-3zM76 40h3v3h-3zM64 43h3v3h-3zM76 43h3v3h-3zM67 46h9v3h-9zM100 28h15v3h-15zM106 31h3v3h-3zM106 34h3v3h-3zM106 37h3v3h-3zM106 40h3v3h-3zM106 43h3v3h-3zM100 46h15v3h-15zM139 28h9v3h-9zM136 31h3v3h-3zM148 31h3v3h-3zM136 34h3v3h-3zM148 34h3v3h-3zM136 37h15v3h-15zM136 40h3v3h-3zM148 40h3v3h-3zM136 43h3v3h-3zM148 43h3v3h-3zM136 46h3v3h-3zM148 46h3v3h-3zM154 28h3v3h-3zM166 28h3v