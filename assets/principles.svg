<svg xmlns="http://www.w3.org/2000/svg" width="830" height="395" viewBox="0 0 830 395" role="img" aria-labelledby="t d"><title id="t">Engineering principles</title><desc id="d">Engineering principles: Reliable over clever — A boring system that stays up beats a clever one that doesn't. Architecture before features — Decide how components talk to each other before deciding what they do. Automation first — If I do it twice by hand, the third time is scripted. Design for maintainability — Code is read far more often than it's written — optimize for that. Measure before optimizing — No tuning without a number to tune against. Production &gt; prototype — A demo proves an idea works. A production system proves it keeps working.</desc><rect x=".5" y=".5" width="829" height="394" fill="#1a1d20" stroke="#30353a"/><path shape-rendering="crispEdges" fill="#f4f1e6" d="M28 28h15v3h-15zM28 31h3v3h-3zM28 34h3v3h-3zM28 37h12v3h-12zM28 40h3v3h-3zM28 43h3v3h-3zM28 46h15v3h-15zM46 28h3v3h-3zM58 28h3v3h-3zM46 31h6v3h-6zM58 31h3v3h-3zM46 34h3v3h-3zM52 34h3v3h-3zM58 34h3v3h-3zM46 37h3v3h-3zM55 37h6v3h-6zM46 40h3v3h-3zM58 40h3v3h-3zM46 43h3v3h-3zM58 43h3v3h-3zM46 46h3v3h-3zM58 46h3v3h-3zM67 28h9v3h-9zM64 31h3v3h-3zM76 31h3v3h-3zM64 34h3v3h-3zM64 37h3v3h-3zM70 37h9v3h-9zM64 40h3v3h-3zM76 40h3v3h-3zM64 43h3v3h-3zM76 43h3v3h-3zM67 46h9v3h-9zM82 28h15v3h-15zM88 31h3v3h-3zM88 34h3v3h-3zM88 37h3v3h-3zM88 40h3v3h-3zM88 43h3v3h-3zM82 46h15v3h-15zM100 28h3v3h-3zM112 28h3v3h-3zM100 31h6v3h-6zM112 31h3v3h-3zM100 34h3v3h-3zM106 34h3v3h-3zM112 34h3v3h-3zM100 37h3v3h-3zM109 37h6v3h-6zM100 40h3v3h-3zM112 40h3v3h-3zM100 43h3v3h-3zM112 43h3v3h-3zM100 46h3v3h-3zM112 46h3v3h-3zM118 28h15v3h-15zM118 31h3v3h-3zM118 34h3v3h-3zM118 37h12v3h-12zM118 40h3v3h-3zM118 43h3v3h-3zM118 46h15v3h-15zM136 28h15v3h-15zM136 31h3v3h-3zM136 34h3v3h-3zM136 37h12v3h-12zM136 40h3v3h-3zM136 43h3v3h-3zM136 46h15v3h-15zM154 28h12v3h-12zM154 31h3v3h-3zM166 31h3v3h-3zM154 34h3v3h-3zM166 34h3v3h-3zM154 37h12v3h-12zM154 40h3v3h-3zM160 