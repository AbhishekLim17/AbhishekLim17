name: profile-3d-contrib

# Renders the 3D contribution graph shown in README.md into /profile-3d-contrib.
# Needs no secrets: the built-in GITHUB_TOKEN can read public contribution data.
on:
  schedule:
    - cron: "0 18 * * *" # daily, 18:00 UTC
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/profile-3d-contrib.yml"]

permissions:
  contents: write

concurrency:
  group: profile-3d-contrib
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      # Actions are pinned to commit SHAs (tags can be moved); the tag is noted alongside.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: yoshi389111/github-profile-3d-contrib@7d95e7d4cdc028dd1e1cbd957d65f35efb12ae39 # v0.9.3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}
      - name: Commit generated SVGs
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add profile-3d-contrib
          if ! git diff --cached --quiet; then
            git commit -m "chore: refresh 3D contribution graph"
            git push
          fi
